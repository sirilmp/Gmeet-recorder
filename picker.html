<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose what to record</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 16px; }
    .ic { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); display: grid; place-items: center; }
    .ic svg { width: 26px; height: 26px; }
    h2 { margin: 0 0 4px; font-size: 17px; }
    p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 8px; justify-content: center; }
  </style>
</head>
<body>
  <div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    <h2>Choose what to record</h2>
    <p id="hint">Pick the screen or window you will share.</p>
    <div class="row">
      <button class="btn btn-primary" id="choose">Choose screen or window</button>
      <button class="btn" id="cancel">Cancel</button>
    </div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
