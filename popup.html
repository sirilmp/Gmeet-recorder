<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { width: 340px; background: var(--surface); }
    .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .logo { width: 26px; height: 26px; border-radius: 7px; flex: none; box-shadow: 0 0 0 1px var(--border); }
    .logo img { width: 100%; height: 100%; border-radius: inherit; display: block; }
    .head h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.005em; }
    .status {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
      height: 26px; padding: 0 10px; border-radius: 999px;
      background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 550;
    }
    .status:has(.dot.live) { background: var(--rec-soft); color: var(--rec); font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }

    .body { padding: 16px; display: grid; gap: 14px; }
    .group { border: 1px solid var(--border); border-radius: var(--radius); }
    .row-card { padding: 12px 14px; }
    .row-card + .row-card { border-top: 1px solid var(--border); }
    .row-card .t { font-weight: 600; font-size: 13px; }
    .row-card .d { color: var(--muted); font-size: 12px; margin-top: 1px; }

    /* Custom slider: same look at rest, hover and drag (no native colour change) */
    #quality { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 6px 0 0; background: transparent; cursor: pointer; outline: none; }
    #quality::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(var(--primary), var(--primary)) 0 0 / var(--fill, 66%) 100% no-repeat, var(--border-strong); }
    #quality::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    #quality:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--focus); }
    #quality:disabled { opacity: .5; cursor: default; }
    .qlabels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); }
    .row-card .cs { display: flex; margin-top: 10px; }
    #mic-perm { margin-top: 10px; width: 100%; }
    #upload-status { font-size: 12.5px; line-height: 1.55; color: var(--muted); padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); }
    #upload-status a { color: var(--text); font-weight: 550; }
    .actions { display: grid; gap: 8px; }
    .actions .pair { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .actions .pair #mark { width: auto; }
    .actions .pair:has(#mark[hidden]) { grid-template-columns: 1fr; }
    #msg { min-height: 17px; text-align: center; font-size: 12px; color: var(--muted); }
    #msg:empty { display: none; }
    #msg.err { color: var(--danger); font-weight: 550; }
    .foot { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: 0; border-top: 1px solid var(--border);
      background: none; color: var(--text); font: inherit; font-size: 13px; font-weight: 550; text-align: left; cursor: pointer; }
    .foot:hover { background: var(--surface-2); }
    .foot:focus-visible { outline: none; background: var(--surface-2); }
    .foot svg { width: 16px; height: 16px; color: var(--muted); }
    .foot .chev { margin-left: auto; }

    /* Live sound wave: bars bounce while sound is heard, height follows the volume */
    #diag .t { margin-bottom: 2px; }
    #diag-lines { display: grid; }
    .st { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 6px 0; }
    .st .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
    .st.ok .sd { background: var(--success); }
    .st.bad .sd { background: var(--danger); }
    .st .sl { font-weight: 500; }
    .st .sv { margin-left: auto; color: var(--muted); }
    .st.bad .sv { color: var(--danger); font-weight: 550; }
    .st .wave { margin-left: 0; }
    .sh { font-size: 11.5px; color: var(--muted); padding: 0 0 6px 15px; }
    .wave { display: inline-flex; align-items: center; gap: 2px; height: 14px; width: 23px; vertical-align: middle; }
    .wave i {
      width: 3px; height: 14px; border-radius: 3px;
      background: var(--border-strong);
      transform: scaleY(.22); transform-origin: center;
    }
    .wave.on i { background: var(--success); animation: wave 1s ease-in-out infinite; }
    .wave.lv-1 { --amp: .45; }
    .wave.lv-2 { --amp: .75; }
    .wave.lv-3 { --amp: 1; }
    .wave i:nth-child(1) { --k: .55; animation-delay: -.9s; }
    .wave i:nth-child(2) { --k: .85; animation-delay: -.3s; }
    .wave i:nth-child(3) { --k: 1;   animation-delay: -.6s; }
    .wave i:nth-child(4) { --k: .75; animation-delay: -.15s; }
    .wave i:nth-child(5) { --k: .5;  animation-delay: -.45s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(.22); }
      50% { transform: scaleY(calc(.22 + .78 * var(--amp) * var(--k))); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave.on i { animation: none; transform: scaleY(calc(.22 + .78 * var(--amp) * var(--k))); }
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo"><img src="icons/icon128.png" alt=""></div>
    <h1>Meet Recorder</h1>
    <div class="status" id="pill"><span class="dot" id="pill-dot"></span><span id="pill-text">Ready</span></div>
  </div>

  <div class="body">
    <div>
      <label class="field-label" for="name">Meeting name</label>
      <input class="input" id="name" type="text" placeholder="e.g. Weekly sync">
    </div>

    <div class="group">
      <div class="row-card">
        <div class="t">Video quality</div>
        <div class="d" id="qDesc"></div>
        <input type="range" id="quality" min="0" max="5" step="1" value="2" aria-label="Video quality">
        <div class="qlabels"><span>Low</span><span>Medium</span><span>Good</span><span>High</span><span>Ultra</span><span>4K</span></div>
      </div>

      <div class="row-card">
        <label class="switch">
          <span>
            <div class="t">My microphone</div>
            <div class="d">Record my voice too</div>
          </span>
          <input type="checkbox" id="useMic" checked>
          <span class="track"></span>
        </label>
        <select id="micId" aria-label="Microphone"></select>
        <button class="btn" id="mic-perm" hidden>Allow microphone access</button>
      </div>

      <div class="row-card" id="diag" hidden>
        <div class="t">Live status</div>
        <div id="diag-lines"></div>
      </div>
    </div>

    <div id="upload-status" hidden></div>

    <div class="actions">
      <button class="btn btn-rec btn-lg" id="start">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>
        Start recording
      </button>
      <div class="pair">
        <button class="btn btn-primary btn-lg" id="stop" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          Stop &amp; save
        </button>
        <button class="btn btn-lg" id="mark" hidden title="Add bookmark (Alt+Shift+B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          <span>Bookmark</span>
        </button>
      </div>
    </div>
    <div id="msg"></div>
  </div>

  <button class="foot" id="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Recordings &amp; Drive upload
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <script src="select.js"></script>
  <script src="popup.js"></script>
</body>
</html>
